name: client_credentials
description: >
  OAuth 2.0 client credentials grant for service-to-service access. No login page, so no interactive MFA.
  This is the supported way for automation to get tokens from Entra ID (app registration / service principal),
  Okta (API services app), Auth0 (machine-to-machine app), Keycloak (service account) and most other OAuth
  servers. Client authentication is client_secret_post, client_secret_basic or private_key_jwt (RS256 or ES256
  signed assertion; pass the certificate to add the x5t / x5t#S256 header Entra uses). The token endpoint comes
  from discovery (issuer) or token_url.

inputs:
  issuer: {default: null}       # discovery at {issuer}/.well-known/openid-configuration (no trailing slash)
  token_url: {default: null}    # overrides discovery
  client_id: {}
  client_secret: {secret: true, default: null}
  private_key: {secret: true, default: null}   # PEM, RSA or EC P-256
  certificate: {default: null}  # PEM; adds x5t thumbprints to the assertion header (Entra)
  key_id: {default: null}       # kid header, when the server matches keys by id (Okta JWKS)
  auth_method: {default: null}  # client_secret_post (default with a secret) | client_secret_basic | private_key_jwt
  scope: {default: null}        # Entra: "{resource}/.default"
  audience: {default: null}     # Auth0 / Okta custom servers that want it
  resource: {default: null}     # RFC 8707 resource indicator

steps:
  # -- endpoint ----------------------------------------------------------------------------------------------
  - set: {token: "${token_url}"}
  - request:
      url: ${issuer}/.well-known/openid-configuration
      headers: {Accept: application/json}
    follow: false
    extract: [{name: discovery, from: json}]
    when: {all: [{exists: "${issuer}"}, {not_exists: "${token}"}]}
  - set: {token: "${discovery.token_endpoint}"}
    when: {not_exists: "${token}"}
  - fail: client_credentials needs issuer (for discovery) or token_url
    when: {not_exists: "${token}"}

  # -- client authentication method --------------------------------------------------------------------------
  - set: {method: "${auth_method}"}
  - set: {method: private_key_jwt}
    when: {all: [{not_exists: "${method}"}, {exists: "${private_key}"}]}
  - set: {method: client_secret_post}
    when: {all: [{not_exists: "${method}"}, {exists: "${client_secret}"}]}
  - fail: client_credentials needs client_secret or private_key
    when: {not_exists: "${method}"}
  - fail: unsupported auth_method ${method} (use client_secret_post, client_secret_basic or private_key_jwt)
    when:
      all:
        - {not_equals: ["${method}", client_secret_post]}
        - {not_equals: ["${method}", client_secret_basic]}
        - {not_equals: ["${method}", private_key_jwt]}
  - fail: auth_method ${method} needs client_secret
    when: {all: [{not_equals: ["${method}", private_key_jwt]}, {not_exists: "${client_secret}"}]}
  - fail: auth_method private_key_jwt needs private_key
    when: {all: [{equals: ["${method}", private_key_jwt]}, {not_exists: "${private_key}"}]}

  - set: {body_client_id: "${client_id}"}
    when: {not_equals: ["${method}", client_secret_basic]}
  - set: {post_secret: "${client_secret}"}
    when: {equals: ["${method}", client_secret_post]}
  - set: {basic_user: "${client_id}", basic_password: "${client_secret}"}
    when: {equals: ["${method}", client_secret_basic]}
  - client_assertion:
      into: assertion
      client_id: ${client_id}
      audience: ${token}
      private_key: ${private_key}
      key_id: ${key_id}
      certificate: ${certificate}
    when: {equals: ["${method}", private_key_jwt]}
  - set: {assertion_type: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"}
    when: {equals: ["${method}", private_key_jwt]}

  # -- token request -----------------------------------------------------------------------------------------
  - request:
      method: POST
      url: ${token}
      headers: {Accept: application/json}
      basic_auth: {username: "${basic_user}", password: "${basic_password}"}
      data:
        grant_type: client_credentials
        client_id: ${body_client_id}
        client_secret: ${post_secret}
        client_assertion_type: ${assertion_type}
        client_assertion: ${assertion}
        scope: ${scope}
        audience: ${audience}
        resource: ${resource}
    follow: false
    extract: [{name: tokens, from: json}]
  - fail:
      message: "client authentication failed: ${tokens.error}: ${tokens.error_description}"
      reason: rejected
    when: {any: [{equals: ["${tokens.error}", invalid_client]}, {equals: ["${tokens.error}", unauthorized_client]}]}
  - fail: "token request failed: ${tokens.error}: ${tokens.error_description}"
    when: {not_exists: "${tokens.access_token}"}

outputs:
  access_token: ${tokens.access_token}
  token_type: ${tokens.token_type}
  expires_in: ${tokens.expires_in}
  scope: ${tokens.scope}
