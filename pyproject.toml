[build-system]
requires = [
    "setuptools"
]
build-backend = "setuptools.build_meta"

[project]
name = "oj-idp-auth"
version = "0.1.0"
description = "Browserless IdP login (SAML, OIDC, vendor flows) over httpx, driven by declarative recipes"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Speedy", email = "speedy@ownjoo.org" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["fido2>=2.0", "pytest", "ruff"]

[project.urls]
Repository = "https://github.com/ownjoo/idp-auth"

[tool.setuptools.packages.find]
include = ["idp_auth*"]

[tool.setuptools.package-data]
idp_auth = ["recipes/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names, etc.)
    "I",      # isort
    "UP",     # pyupgrade (modernise syntax for target Python version)
    "B",      # flake8-bugbear (common bug patterns)
    "ASYNC",  # flake8-async (async best practices)
    "RUF",    # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["idp_auth"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
skip-magic-trailing-comma = false  # trailing comma forces vertical expansion

[tool.pytest.ini_options]
testpaths = ["test"]
